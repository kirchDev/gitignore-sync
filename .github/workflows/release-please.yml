# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Please

on:
  push:
    branches:
      - main

# PERMISSIONS PER JOB, NOT PER WORKFLOW: a workflow-level block caps every
# called body, and the publish jobs need `id-token: write` for npm's Trusted
# Publishing — a cap makes the run fail at startup rather than at that step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Release-please only ever runs on the release branch.
    if: github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@4767c07534dcf886d6a387f29dc70a097b44c591 # v0.14.0
    with:
      # This package is consumed as `kirchDev/gitignore-sync@<ref>`, so `@v0`
      # has to keep meaning "the newest v0.x.y".
      major-alias: true
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  publish-release:
    name: Publish stable release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and the provenance attestation. No
      # NPM_TOKEN exists in this repo; npm verifies this workflow against the
      # trusted publisher configured on the package.
      id-token: write
    # `build-script` is left at its default: this repo's `build` writes the npm
    # artifact itself. coverage-report needs `build:npm` there only because its
    # `build` produces an Action bundle instead.
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@4767c07534dcf886d6a387f29dc70a097b44c591 # v0.14.0
    with:
      tag-name: ${{ needs.release-please.outputs.tag-name }}

  # One job per platform, and it has to be that way: a single executable is the
  # target platform's own node binary with a blob injected into it, so there is
  # nothing to cross-compile from. `macos-15-intel` is the Intel label that
  # replaced the retired `macos-13`.
  #
  # Only stable releases get binaries. A prerelease publishes to npm without
  # cutting a GitHub release, so there would be nothing to attach them to.
  publish-binaries:
    name: Attach ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      # `gh release upload` writes into the release release-please just cut.
      contents: write
    strategy:
      # Every platform reports, rather than the first failure hiding the rest.
      # A missing asset is visible on the release either way.
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag, not the branch tip: the artifact has to carry the version
          # that was released, and `--version` is inlined at build time.
          ref: ${{ needs.release-please.outputs.tag-name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` first: it empties `dist` to write the npm artifact, which would
      # take the binary with it the other way round.
      - run: pnpm build
      - run: pnpm sea:build

      - name: Attach the archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag-name }}"
          dist/release/*.tar.gz dist/release/*.tar.gz.sha256
          --clobber

  publish-prerelease:
    name: Publish prerelease
    # Skip the version-bump merges release-please pushes onto main — those are
    # the stable release, and publishing a prerelease from them would shadow it.
    if: >-
      ${{
        github.ref_name == 'main'
        && !startsWith(github.event.head_commit.message, 'chore(main): release')
        && !startsWith(github.event.head_commit.message, 'chore: release')
      }}
    permissions:
      contents: read
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@4767c07534dcf886d6a387f29dc70a097b44c591 # v0.14.0
    with:
      prerelease: true
