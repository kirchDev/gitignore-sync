# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Please

on:
  push:
    branches:
      - main
      # dev reaches this workflow for the prerelease job only; release-please
      # itself is gated to the release branch below.
      - dev

# PERMISSIONS PER JOB, NOT PER WORKFLOW: a workflow-level block caps every
# called body, and the publish jobs need `id-token: write` for npm's Trusted
# Publishing — a cap makes the run fail at startup rather than at that step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # `dev` reaches this workflow for the prerelease job below; release-please
    # itself only ever runs on the release branch.
    if: github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@7fd4eaf529500fcd07c527ae70c839ab9ac7d76f # v0.7.0
    with:
      # This package is consumed as `kirchDev/gitignore-sync@<ref>`, so `@v0`
      # has to keep meaning "the newest v0.x.y".
      major-alias: true
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  publish-release:
    name: Publish stable release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and the provenance attestation. No
      # NPM_TOKEN exists in this repo; npm verifies this workflow against the
      # trusted publisher configured on the package.
      id-token: write
    # `build-script` is left at its default: this repo's `build` writes the npm
    # artifact itself. coverage-report needs `build:npm` there only because its
    # `build` produces an Action bundle instead.
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@7fd4eaf529500fcd07c527ae70c839ab9ac7d76f # v0.7.0
    with:
      tag-name: ${{ needs.release-please.outputs.tag-name }}

  publish-prerelease:
    name: Publish prerelease
    # Skip the version-bump merges release-please pushes onto main — those are
    # the stable release, and publishing a prerelease from them would shadow it.
    if: >-
      ${{
        github.ref_name == 'dev'
        || (
          github.ref_name == 'main'
          && !startsWith(github.event.head_commit.message, 'chore(main): release')
          && !startsWith(github.event.head_commit.message, 'chore: release')
        )
      }}
    permissions:
      contents: read
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@7fd4eaf529500fcd07c527ae70c839ab9ac7d76f # v0.7.0
    with:
      prerelease: true
