# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The body reads the integration branch off the pull request's own base, so the
# `branches:` filter below is the only place it is named.
name: Queue Branch

on:
  pull_request:
    branches:
      - dev
    types: [opened]

jobs:
  queue-branch:
    name: Queue Branch
    permissions:
      contents: read
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_queue-branch.yml@c4cce887e4df7cceb397bb556934e3c82bc6a69d # v0.4.0
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
